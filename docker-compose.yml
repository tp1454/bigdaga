services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SNAPSHOT_TRUST_EMPTY: "true"       
    volumes:
      - ./volumes/zookeeper-data:/var/lib/zookeeper/data
      - ./volumes/zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/2181' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [streaming]

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-29092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - ./volumes/kafka-data:/var/lib/kafka/data
      - ./init/kafka/create-topics.sh:/etc/kafka/create-topics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks: [streaming]

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1                    
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./init/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    environment:
      KAFKA_BROKER: kafka:29092
    restart: "no"
    networks: [streaming]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [streaming]

  grafana:
    image: grafana/grafana:11.4.2
    container_name: grafana
    depends_on:
      - clickhouse
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./volumes/grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [streaming]

  yahoo-producer:
    build: ./producers
    container_name: yahoo-producer
    restart: unless-stopped
    command: python -m src.equities.yahoo_producer
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully        
    networks: [streaming]

  binance-producer:
    build: ./producers
    container_name: binance-producer
    restart: unless-stopped
    command: python -m src.crypto.binance_ws_producer
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully        
    networks: [streaming]

  forex-producer:
    build: ./producers
    container_name: forex-producer
    restart: unless-stopped
    command: python -m src.forex.forex_producer
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully        
    networks: [streaming]

  coingecko-producer:
    build: ./producers
    container_name: coingecko-producer
    restart: unless-stopped
    command: python -m src.crypto.coingecko_producer
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully        
    networks: [streaming]

  sec-edgar-producer:
    build: ./producers
    container_name: sec-edgar-producer
    restart: unless-stopped
    command: python -m src.equities.sec_edgar_producer
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully        
    networks: [streaming]

  bls-producer:
    build: ./producers
    container_name: bls-producer
    restart: unless-stopped
    command: python -m src.macro.bls_producer
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully        
    networks: [streaming]

  treasury-producer:
    build: ./producers
    container_name: treasury-producer
    restart: unless-stopped
    command: python -m src.macro.treasury_producer
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully        
    networks: [streaming]

  # ==========================================
  # CONSUMER (Đã vô hiệu hóa để nhường chỗ cho Flink)
  # ==========================================
  # consumer:
  #   build: ./consumers
  #   container_name: consumer
  #   restart: unless-stopped
  #   environment:
  #     KAFKA_BROKER: kafka:29092
  #     CLICKHOUSE_HOST: clickhouse
  #   depends_on:
  #     kafka-init:
  #       condition: service_completed_successfully
  #     clickhouse:
  #       condition: service_healthy
  #   networks: [streaming]

  # ==========================================
  # FLINK CLUSTER
  # ==========================================
  jobmanager:
    build: ./flink-jobs
    container_name: jobmanager
    ports:
      - "8081:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    command: >
      bash -c "
      /docker-entrypoint.sh jobmanager & 
      sleep 5;
      flink run -d -m localhost:8081 -py /opt/flink/usrlib/src/job_kafka_to_clickhouse.py --pyFiles /opt/flink/usrlib/src/transforms.py,/opt/flink/usrlib/src/config.py;
      tail -f /dev/null
      "
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8081/jobs/overview | grep -q '\"state\":\"RUNNING\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [streaming]

  taskmanager:
    build: ./flink-jobs
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    networks: [streaming]

networks:
  streaming:
    driver: bridge

volumes:
  clickhouse_data: